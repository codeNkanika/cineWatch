<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Cozy Watchlist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕯️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav__brand"><span class="nav__flame">🕯️</span> Cozy Watchlist</a>
    <a href="/login" class="nav__link">Log in →</a>
  </nav>

  <div class="auth-wrap">
    <form class="auth-card" id="signup-form">
      <h1>Create your account</h1>
      <p class="auth-sub">Your watchlist stays private to you, always.</p>

      <label for="email-input">Email</label>
      <input type="email" id="email-input" required autocomplete="email" />

      <label for="password-input">Password</label>
      <input type="password" id="password-input" required minlength="8" autocomplete="new-password" />
      <p class="auth-hint">At least 8 characters.</p>

      <p class="auth-error" id="auth-error"></p>

      <button type="submit" class="btn btn--primary auth-submit">Sign up</button>

      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>wireAuthForm("signup-form", "/signup", "/watchlist");</script>
</body>
</html>
